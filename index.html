<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>タクシー記録アプリ</title>

  <!-- ホーム画面追加用（アプリ名・アイコン） -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#ffc107">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="タクシー記録">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ログイン表示 */
    #authBar {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1100;

      display: flex;
      align-items: center;
      gap: 8px;

      width: fit-content;
      max-width: calc(100% - 60px);
      box-sizing: border-box;
      padding: 8px 6px 8px 10px;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    #authBar button {
      flex-shrink: 0;
      padding: 8px 12px;

      color: #fff;
      background: #4285f4;
      border: none;
      border-radius: 6px;

      cursor: pointer;
    }

    #btnLogout {
      background: #777 !important;
    }

    #userInfo {
      min-width: 0;
      overflow: hidden;

      font-size: 13px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 未ログイン時は空のspanが余白を作らないようにする */
    #userInfo:empty {
      display: none;
    }

    /* 時間帯スライダー */
    #timeBar {
      position: absolute;
      top: 68px;
      right: 10px;
      left: 50px;
      z-index: 1100;

      box-sizing: border-box;
      padding: 6px 10px 8px;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    #timeBarTop {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #timeLabel {
      flex: 1;
      min-width: 0;

      font-size: 13px;
      white-space: nowrap;
    }

    #timeBar button {
      padding: 4px 10px;

      font-size: 12px;

      background: #eee;
      border: 1px solid #ccc;
      border-radius: 6px;

      cursor: pointer;
    }

    #timeSlider {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 6px 0 0;
    }

    .btn {
      position: absolute;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 50px;
      height: 50px;

      font-size: 24px;

      background: #fff;
      border: none;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

      cursor: pointer;
    }

    .btn.active {
      background: #bbdefb;
    }

    #btnAdd {
      right: 15px;
      bottom: 110px;

      color: #fff;
      background: #2196f3;
    }

    #btnLocate {
      right: 15px;
      bottom: 180px;
    }

    #btnSettings {
      right: 15px;
      bottom: 250px;
    }

    #btnGroup {
      right: 15px;
      bottom: 320px;
    }

    #btnAmountMode {
      bottom: 110px;
      left: 15px;
    }

    /* 金額の凡例 */
    #amountLegend {
      position: absolute;
      bottom: 170px;
      left: 15px;
      z-index: 1000;

      display: none;

      padding: 6px 10px;

      font-size: 12px;
      line-height: 1.6;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .legend-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 5px;

      vertical-align: -1px;

      border-radius: 50%;
    }

    /*
     * 常時表示のピン。
     * 幅・高さ0の枠を画面中央に置き、SVGの先端をその一点に合わせることで、
     * 「ピンの先端 = 地図の中心 = 記録される位置」にしています。
     */
    #centerPin {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 999;

      width: 0;
      height: 0;

      pointer-events: none;
    }

    #centerPin svg {
      position: absolute;
      bottom: 0;
      left: -16px;

      display: block;
      width: 32px;
      height: 44px;

      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }

    #centerPin::after {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;

      width: 4px;
      height: 4px;

      background: #000;
      border-radius: 50%;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.5);
    }

    .modal-box {
      width: 85%;
      max-width: 350px;
      max-height: 80vh;
      padding: 20px;

      overflow-y: auto;

      background: #fff;
      border-radius: 12px;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .modal-box label {
      display: block;

      margin-top: 12px;

      color: #333;
      font-size: 14px;
    }

    .modal-box select,
    .modal-box input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
      padding: 8px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-note {
      margin: 10px 0 0;

      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .choice-group {
      display: flex;
      gap: 8px;

      margin-top: 4px;
    }

    .choice-btn {
      flex: 1;

      padding: 10px;

      font-size: 14px;
      text-align: center;

      background: #f5f5f5;
      border: 2px solid #ccc;
      border-radius: 8px;

      cursor: pointer;
    }

    .choice-btn.selected {
      font-weight: bold;

      background: #e3f2fd;
      border-color: #2196f3;
    }

    .modal-actions {
      display: flex;
      gap: 10px;

      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;

      padding: 12px 6px;

      font-size: 15px;

      border: none;
      border-radius: 8px;

      cursor: pointer;
    }

    .btn-save {
      color: #fff;
      background: #2196f3;
    }

    .btn-danger {
      color: #fff;
      background: #e53935;
    }

    .btn-cancel {
      background: #ccc;
    }

    .detail-row {
      margin-top: 8px;

      font-size: 15px;
    }

    .detail-row span {
      display: inline-block;
      width: 5.5em;

      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <!-- ログイン欄 -->
  <div id="authBar">
    <button id="btnLogin" type="button">Googleでログイン</button>

    <button id="btnLogout" type="button" style="display: none;">
      ログアウト
    </button>

    <span id="userInfo"></span>
  </div>

  <!-- 時間帯スライダー -->
  <div id="timeBar">
    <div id="timeBarTop">
      <div id="timeLabel">🕒 全時間帯を表示</div>
      <button id="btnTimeNow" type="button">いま</button>
      <button id="btnTimeClear" type="button">解除</button>
    </div>

    <input
      type="range"
      id="timeSlider"
      min="0"
      max="1435"
      step="5"
      value="720"
    >
  </div>

  <div id="map"></div>

  <!-- 常時表示のピン（先端が地図の中心） -->
  <div id="centerPin">
    <svg viewBox="0 0 32 44" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M16 44C16 44 2 27 2 16A14 14 0 1 1 30 16C30 27 16 44 16 44Z"
        fill="#e53935"
        stroke="#fff"
        stroke-width="2"
      />
      <circle cx="16" cy="16" r="5" fill="#fff" />
    </svg>
  </div>

  <div id="amountLegend"></div>

  <button
    id="btnGroup"
    class="btn"
    type="button"
    title="グループ"
  >
    👥
  </button>

  <button
    id="btnSettings"
    class="btn"
    type="button"
    title="設定"
  >
    ⚙️
  </button>

  <button
    id="btnLocate"
    class="btn"
    type="button"
    title="現在地へ移動"
  >
    🎯
  </button>

  <button
    id="btnAdd"
    class="btn"
    type="button"
    title="ピンの位置に記録"
  >
    ➕
  </button>

  <button
    id="btnAmountMode"
    class="btn"
    type="button"
    title="金額確認モード"
  >
    🔘
  </button>

  <!-- 記録入力・編集モーダル -->
  <div id="recordModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="recordModalTitle">乗車記録の入力</h3>

      <label>乗り方</label>

      <div class="choice-group" id="norikataGroup">
        <div class="choice-btn" data-value="すぐ">🟢 すぐ</div>
        <div class="choice-btn" data-value="普通">🟡 普通</div>
        <div class="choice-btn" data-value="おそい">🔴 おそい</div>
      </div>

      <label>きっかけ</label>

      <div class="choice-group" id="kikkakeGroup">
        <div class="choice-btn" data-value="手上げ">✋ 手上げ</div>
        <div class="choice-btn" data-value="GO">📱 GO</div>
        <div class="choice-btn" data-value="無線">📻 無線</div>
      </div>

      <label for="inputRyoukin">料金（円）</label>
      <input
        type="number"
        id="inputRyoukin"
        min="0"
        step="1"
        inputmode="numeric"
        placeholder="例：1500"
      >

      <label for="inputDateTime">日時</label>
      <input type="datetime-local" id="inputDateTime">

      <div class="modal-actions">
        <button class="btn-save" id="btnSaveRecord" type="button">
          保存
        </button>

        <button class="btn-cancel" id="btnCancelRecord" type="button">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- 記録の詳細（編集・削除） -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-box">
      <h3>乗車記録</h3>

      <div id="detailBody"></div>

      <div class="modal-actions">
        <button class="btn-save" id="btnDetailEdit" type="button">
          編集
        </button>

        <button class="btn-danger" id="btnDetailDelete" type="button">
          削除
        </button>

        <button class="btn-cancel" id="btnDetailClose" type="button">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
      <h3>設定</h3>

      <label for="settingBoundary1">
        赤／黄の境界金額（円）
      </label>
      <input
        type="number"
        id="settingBoundary1"
        min="0"
        step="1"
      >

      <label for="settingBoundary2">
        黄／緑の境界金額（円）
      </label>
      <input
        type="number"
        id="settingBoundary2"
        min="0"
        step="1"
      >

      <label for="settingPickupFee">迎車料金（円）</label>
      <input
        type="number"
        id="settingPickupFee"
        min="0"
        step="1"
      >

      <div class="modal-actions">
        <button class="btn-save" id="btnSaveSettings" type="button">
          保存
        </button>

        <button class="btn-cancel" id="btnCancelSettings" type="button">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- グループモーダル -->
  <div id="groupModal" class="modal-overlay">
    <div class="modal-box">
      <h3>グループ</h3>

      <p id="groupLoginNote" class="modal-note" style="display: none;">
        グループを使うには、画面上部の「Googleでログイン」が必要です。
      </p>

      <div id="groupJoinArea">
        <label for="groupPassword">グループのパスワード</label>
        <input
          type="password"
          id="groupPassword"
          autocomplete="off"
          placeholder="6文字以上"
        >

        <p class="modal-note">
          同じパスワードを入力した人どうしで、過去の記録が共有されます。
          パスワードを知っている人は誰でも参加できるので、
          推測されにくい長めのものにしてください。
          記録した人のGoogleアカウント名もグループ内に表示されます。
        </p>

        <div class="modal-actions">
          <button class="btn-save" id="btnGroupJoin" type="button">
            参加する
          </button>

          <button class="btn-cancel" id="btnGroupCloseA" type="button">
            閉じる
          </button>
        </div>
      </div>

      <div id="groupJoinedArea" style="display: none;">
        <p>グループに参加中です。<br>メンバーの記録は青い枠で表示されます。</p>

        <div class="modal-actions">
          <button class="btn-danger" id="btnGroupLeave" type="button">
            退出する
          </button>

          <button class="btn-cancel" id="btnGroupCloseB" type="button">
            閉じる
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK：初期化より先に読み込む -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
     * ========================================
     * Firebase
     * ========================================
     */

    const firebaseConfig = {
      apiKey: "AIzaSyBYDXz3g8re8cy9w8Ly7cUzgtsp9hJO4xQ",
      authDomain: "taxi-app-2d438.firebaseapp.com",
      projectId: "taxi-app-2d438",
      storageBucket: "taxi-app-2d438.firebasestorage.app",
      messagingSenderId: "1048346895898",
      appId: "1:1048346895898:web:b7799a6576d0829b2253a3"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    /*
     * ========================================
     * 基本データ
     * ========================================
     */

    const DEFAULT_SETTINGS = {
      boundary1: 2000,
      boundary2: 4000,
      pickupFee: 500
    };

    const savedSettings = localStorage.getItem("taxi_settings");

    let settings = savedSettings
      ? { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) }
      : { ...DEFAULT_SETTINGS };

    let records = [];
    let mode = "normal";
    let filterMinute = null;
    let pendingLatLng = null;
    let editingRecord = null;
    let detailRecord = null;

    let selectedNorikata = null;
    let selectedKikkake = null;

    const DRAFT_KEY = "taxi_draft";
    const VIEW_KEY = "taxi_view";
    const GROUP_KEY = "taxi_group_id";

    /*
     * ========================================
     * ローカル保存
     * ========================================
     */

    function getRecordsStorageKey() {
      const user = auth.currentUser;

      if (user) {
        return `taxi_records_${user.uid}`;
      }

      return "taxi_records_guest";
    }

    function loadLocalRecords() {
      try {
        const savedRecords = localStorage.getItem(
          getRecordsStorageKey()
        );

        return savedRecords ? JSON.parse(savedRecords) : [];
      } catch (error) {
        console.error("端末データの読み込みエラー:", error);
        return [];
      }
    }

    function saveRecordsLocally() {
      localStorage.setItem(
        getRecordsStorageKey(),
        JSON.stringify(records)
      );
    }

    function saveSettings() {
      localStorage.setItem(
        "taxi_settings",
        JSON.stringify(settings)
      );
    }

    /* Firestoreに書き込む項目だけを取り出す */
    function cleanRecord(record) {
      return {
        id: record.id,
        lat: record.lat,
        lng: record.lng,
        time: record.time,
        norikata: record.norikata,
        kikkake: record.kikkake,
        ryoukin: record.ryoukin
      };
    }

    function isOwnRecord(record) {
      const user = auth.currentUser;

      return !record.uid || (user && record.uid === user.uid);
    }

    /*
     * ========================================
     * 地図
     * ========================================
     */

    const map = L.map("map").setView(
      [35.681236, 139.767125],
      16
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    let currentLocationMarker = null;
    let currentAccuracyCircle = null;
    let firstFix = true;

    /*
     * 直前に見ていた地図の位置を覚えておき、
     * 30分以内に開き直した場合は、その位置から再開します。
     */
    function restoreRecentView() {
      try {
        const view = JSON.parse(localStorage.getItem(VIEW_KEY));

        if (
          view &&
          Date.now() - view.savedAt < 30 * 60 * 1000
        ) {
          map.setView([view.lat, view.lng], view.zoom, {
            animate: false
          });

          firstFix = false;
        }
      } catch (error) {
        console.error("地図位置の復元エラー:", error);
      }
    }

    function getCurrentView() {
      const center = map.getCenter();

      return {
        lat: center.lat,
        lng: center.lng,
        zoom: map.getZoom()
      };
    }

    map.on("moveend", () => {
      localStorage.setItem(
        VIEW_KEY,
        JSON.stringify({
          ...getCurrentView(),
          savedAt: Date.now()
        })
      );
    });

    restoreRecentView();

    function startWatchingLocation() {
      if (!navigator.geolocation) {
        console.warn("この端末は位置情報に対応していません。");
        return;
      }

      navigator.geolocation.watchPosition(
        onLocationUpdate,
        onLocationError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    function onLocationUpdate(position) {
      const {
        latitude,
        longitude,
        accuracy
      } = position.coords;

      const latlng = [latitude, longitude];

      if (!currentLocationMarker) {
        currentLocationMarker = L.circleMarker(latlng, {
          radius: 8,
          color: "#fff",
          weight: 2,
          fillColor: "#2196f3",
          fillOpacity: 1
        }).addTo(map);

        currentAccuracyCircle = L.circle(latlng, {
          radius: accuracy,
          color: "#2196f3",
          fillColor: "#2196f3",
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);
      } else {
        currentLocationMarker.setLatLng(latlng);
        currentAccuracyCircle.setLatLng(latlng);
        currentAccuracyCircle.setRadius(accuracy);
      }

      if (firstFix) {
        map.setView(latlng, 17);
        firstFix = false;
      }
    }

    function onLocationError(error) {
      console.error("位置情報エラー:", error);

      if (error.code === error.PERMISSION_DENIED) {
        console.warn("位置情報の利用が許可されていません。");
      }
    }

    startWatchingLocation();

    /*
     * ========================================
     * 現在地ボタン
     * ========================================
     */

    document
      .getElementById("btnLocate")
      .addEventListener("click", () => {
        if (currentLocationMarker) {
          map.setView(
            currentLocationMarker.getLatLng(),
            17
          );
        } else {
          alert(
            "現在地を取得中です。少し待ってから再度お試しください。"
          );
        }
      });

    /*
     * ========================================
     * 記録入力モーダル（新規・編集）
     * ========================================
     */

    const recordModal = document.getElementById("recordModal");
    const inputRyoukin = document.getElementById("inputRyoukin");
    const inputDateTime = document.getElementById("inputDateTime");

    function toLocalInputValue(date) {
      const shifted = new Date(
        date.getTime() - date.getTimezoneOffset() * 60000
      );

      return shifted.toISOString().slice(0, 16);
    }

    function selectChoice(groupId, value) {
      document
        .querySelectorAll(`#${groupId} .choice-btn`)
        .forEach((item) => {
          item.classList.toggle(
            "selected",
            item.dataset.value === value
          );
        });
    }

    document
      .querySelectorAll("#norikataGroup .choice-btn")
      .forEach((button) => {
        button.addEventListener("click", () => {
          selectedNorikata = button.dataset.value;
          selectChoice("norikataGroup", selectedNorikata);
          saveDraft();
        });
      });

    document
      .querySelectorAll("#kikkakeGroup .choice-btn")
      .forEach((button) => {
        button.addEventListener("click", () => {
          selectedKikkake = button.dataset.value;
          selectChoice("kikkakeGroup", selectedKikkake);
          saveDraft();
        });
      });

    inputRyoukin.addEventListener("input", saveDraft);
    inputDateTime.addEventListener("input", saveDraft);
    inputDateTime.addEventListener("change", saveDraft);

    /*
     * 入力途中の内容を端末に保存します。
     * 他のアプリを使っている間にページが再読み込みされても、
     * 戻ったときに入力画面とピンの位置を復元できます。
     */
    function saveDraft() {
      if (recordModal.style.display !== "flex") {
        return;
      }

      localStorage.setItem(
        DRAFT_KEY,
        JSON.stringify({
          pending: pendingLatLng,
          editingRecord: editingRecord ? cleanRecord(editingRecord) : null,
          norikata: selectedNorikata,
          kikkake: selectedKikkake,
          ryoukin: inputRyoukin.value,
          dateTime: inputDateTime.value,
          view: getCurrentView(),
          savedAt: Date.now()
        })
      );
    }

    function clearDraft() {
      localStorage.removeItem(DRAFT_KEY);
    }

    function openRecordModal(record) {
      editingRecord = record || null;

      document.getElementById("recordModalTitle").textContent =
        record ? "乗車記録の編集" : "乗車記録の入力";

      if (record) {
        selectedNorikata = record.norikata;
        selectedKikkake = record.kikkake;
        inputRyoukin.value = record.ryoukin;

        const date = new Date(record.time);

        inputDateTime.value = Number.isNaN(date.getTime())
          ? toLocalInputValue(new Date())
          : toLocalInputValue(date);
      } else {
        selectedNorikata = null;
        selectedKikkake = null;
        inputRyoukin.value = "";
        inputDateTime.value = toLocalInputValue(new Date());
      }

      selectChoice("norikataGroup", selectedNorikata);
      selectChoice("kikkakeGroup", selectedKikkake);

      recordModal.style.display = "flex";

      saveDraft();
    }

    function closeRecordModal() {
      recordModal.style.display = "none";
      pendingLatLng = null;
      editingRecord = null;
      clearDraft();
    }

    function restoreDraft() {
      let draft = null;

      try {
        draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
      } catch (error) {
        draft = null;
      }

      if (
        !draft ||
        Date.now() - draft.savedAt > 12 * 60 * 60 * 1000
      ) {
        clearDraft();
        return;
      }

      if (draft.editingRecord) {
        /*
         * ログイン状態の確認前に復元するため、
         * 編集中の記録そのものを下書きに保存しています。
         */
        editingRecord = draft.editingRecord;
      } else {
        if (!draft.pending) {
          clearDraft();
          return;
        }

        editingRecord = null;
        pendingLatLng = draft.pending;
      }

      if (draft.view) {
        map.setView(
          [draft.view.lat, draft.view.lng],
          draft.view.zoom,
          { animate: false }
        );

        firstFix = false;
      }

      document.getElementById("recordModalTitle").textContent =
        editingRecord ? "乗車記録の編集" : "乗車記録の入力";

      selectedNorikata = draft.norikata;
      selectedKikkake = draft.kikkake;
      inputRyoukin.value = draft.ryoukin || "";
      inputDateTime.value = draft.dateTime || "";

      selectChoice("norikataGroup", selectedNorikata);
      selectChoice("kikkakeGroup", selectedKikkake);

      recordModal.style.display = "flex";
    }

    /* ＋ボタン：ピンの位置（地図の中心）にそのまま記録する */
    document
      .getElementById("btnAdd")
      .addEventListener("click", () => {
        const center = map.getCenter();

        pendingLatLng = {
          lat: center.lat,
          lng: center.lng
        };

        openRecordModal(null);
      });

    document
      .getElementById("btnCancelRecord")
      .addEventListener("click", closeRecordModal);

    /*
     * ========================================
     * 記録の保存・更新
     * ========================================
     */

    document
      .getElementById("btnSaveRecord")
      .addEventListener("click", async () => {
        if (!editingRecord && !pendingLatLng) {
          alert("記録する場所が選択されていません。");
          return;
        }

        if (!selectedNorikata || !selectedKikkake) {
          alert("乗り方ときっかけを選択してください。");
          return;
        }

        const ryoukin = Number.parseInt(
          inputRyoukin.value,
          10
        );

        if (!Number.isFinite(ryoukin) || ryoukin < 0) {
          alert("料金を正しく入力してください。");
          return;
        }

        if (!inputDateTime.value) {
          alert("日時を入力してください。");
          return;
        }

        const date = new Date(inputDateTime.value);

        if (Number.isNaN(date.getTime())) {
          alert("日時を正しく入力してください。");
          return;
        }

        if (editingRecord) {
          const updated = {
            ...cleanRecord(editingRecord),
            time: date.toISOString(),
            norikata: selectedNorikata,
            kikkake: selectedKikkake,
            ryoukin
          };

          closeRecordModal();

          await updateRecord(updated);

          return;
        }

        const record = {
          id:
            Date.now().toString() +
            Math.random().toString(36).slice(2, 8),

          lat: pendingLatLng.lat,
          lng: pendingLatLng.lng,
          time: date.toISOString(),
          norikata: selectedNorikata,
          kikkake: selectedKikkake,
          ryoukin
        };

        records.push(record);
        saveRecordsLocally();
        renderMarkers();

        closeRecordModal();

        if (auth.currentUser) {
          try {
            await saveToFirestore(record);

            if (currentGroupId) {
              await saveToGroup(record);
            }
          } catch (error) {
            console.error(
              "Firestoreへの保存エラー:",
              error
            );

            alert(
              "端末には保存しましたが、クラウド保存に失敗しました。\n" +
              error.message
            );
          }
        }
      });

    async function updateRecord(updated) {
      const index = records.findIndex((item) => {
        return item.id === updated.id;
      });

      let documentId = updated.id;

      if (index >= 0) {
        documentId =
          records[index]._firestoreDocId || updated.id;

        records[index] = {
          ...records[index],
          ...updated
        };
      } else {
        records.push(updated);
      }

      saveRecordsLocally();
      renderMarkers();

      const user = auth.currentUser;

      if (!user) {
        return;
      }

      try {
        await db
          .collection("users")
          .doc(user.uid)
          .collection("records")
          .doc(documentId)
          .set(updated);

        if (currentGroupId && groupIds.has(updated.id)) {
          await saveToGroup(updated);
        }
      } catch (error) {
        console.error("Firestoreの更新エラー:", error);

        alert(
          "端末では変更しましたが、クラウドの更新に失敗しました。\n" +
          error.message
        );
      }
    }

    /*
     * ========================================
     * Firestoreへの保存・読み込み
     * ========================================
     */

    async function saveToFirestore(record) {
      const user = auth.currentUser;

      if (!user) {
        throw new Error("ログインしていません。");
      }

      /*
       * record.idをFirestoreのドキュメントIDにすることで、
       * 同じ記録の重複保存を防ぎます。
       */
      await db
        .collection("users")
        .doc(user.uid)
        .collection("records")
        .doc(record.id)
        .set(cleanRecord(record));
    }

    async function loadRecordsFromFirestore() {
      const user = auth.currentUser;

      if (!user) {
        records = loadLocalRecords();
        renderMarkers();
        return;
      }

      try {
        const snapshot = await db
          .collection("users")
          .doc(user.uid)
          .collection("records")
          .get();

        records = snapshot.docs.map((documentSnapshot) => {
          const data = documentSnapshot.data();

          /*
           * 以前のコードで自動IDを使用していた記録にも
           * 対応できるようFirestore側のIDを保持します。
           */
          return {
            ...data,
            id: data.id || documentSnapshot.id,
            _firestoreDocId: documentSnapshot.id
          };
        });

        saveRecordsLocally();
        renderMarkers();
      } catch (error) {
        console.error(
          "Firestoreからの読み込みエラー:",
          error
        );

        records = loadLocalRecords();
        renderMarkers();

        alert(
          "クラウドデータの読み込みに失敗したため、" +
          "端末内のデータを表示します。\n" +
          error.message
        );
      }
    }

    /*
     * ========================================
     * グループ（パスワード共有）
     *
     * パスワードをSHA-256でハッシュ化した値をグループIDとして使い、
     * groups/{グループID}/records に記録を保存します。
     * 同じパスワードを入力した人は同じグループIDになるため、
     * 記録を共有できます。
     * ========================================
     */

    let currentGroupId = localStorage.getItem(GROUP_KEY) || null;
    let groupRecords = [];
    let groupIds = new Set();
    let unsubscribeGroup = null;

    async function hashPassword(password) {
      const data = new TextEncoder().encode(
        "taxi-record-app:v1:" + password
      );

      const buffer = await crypto.subtle.digest("SHA-256", data);

      return Array.from(new Uint8Array(buffer))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function groupRecordsRef(groupId) {
      return db
        .collection("groups")
        .doc(groupId)
        .collection("records");
    }

    async function saveToGroup(record) {
      const user = auth.currentUser;

      if (!user || !currentGroupId) {
        return;
      }

      await groupRecordsRef(currentGroupId)
        .doc(record.id)
        .set({
          ...cleanRecord(record),
          uid: user.uid,
          userName: user.displayName || ""
        });
    }

    function stopGroupListener() {
      if (unsubscribeGroup) {
        unsubscribeGroup();
        unsubscribeGroup = null;
      }
    }

    function startGroupListener() {
      stopGroupListener();

      if (!auth.currentUser || !currentGroupId) {
        return;
      }

      unsubscribeGroup = groupRecordsRef(currentGroupId).onSnapshot(
        (snapshot) => {
          groupRecords = snapshot.docs.map((documentSnapshot) => {
            const data = documentSnapshot.data();

            return {
              ...data,
              id: data.id || documentSnapshot.id
            };
          });

          groupIds = new Set(
            groupRecords.map((item) => item.id)
          );

          renderMarkers();
        },
        (error) => {
          console.error("グループの読み込みエラー:", error);

          alert(
            "グループの記録を読み込めませんでした。\n" +
            error.message
          );
        }
      );
    }

    async function shareAllRecordsToGroup() {
      const user = auth.currentUser;

      if (!user || !currentGroupId) {
        return;
      }

      for (let i = 0; i < records.length; i += 400) {
        const batch = db.batch();

        records.slice(i, i + 400).forEach((record) => {
          batch.set(
            groupRecordsRef(currentGroupId).doc(record.id),
            {
              ...cleanRecord(record),
              uid: user.uid,
              userName: user.displayName || ""
            }
          );
        });

        await batch.commit();
      }
    }

    const groupModal = document.getElementById("groupModal");
    const btnGroup = document.getElementById("btnGroup");

    function updateGroupUI() {
      const joined = Boolean(currentGroupId);

      btnGroup.classList.toggle("active", joined);

      document.getElementById("groupJoinArea").style.display =
        joined ? "none" : "block";

      document.getElementById("groupJoinedArea").style.display =
        joined ? "block" : "none";

      document.getElementById("groupLoginNote").style.display =
        auth.currentUser ? "none" : "block";
    }

    btnGroup.addEventListener("click", () => {
      document.getElementById("groupPassword").value = "";
      updateGroupUI();
      groupModal.style.display = "flex";
    });

    ["btnGroupCloseA", "btnGroupCloseB"].forEach((id) => {
      document.getElementById(id).addEventListener("click", () => {
        groupModal.style.display = "none";
      });
    });

    document
      .getElementById("btnGroupJoin")
      .addEventListener("click", async () => {
        if (!auth.currentUser) {
          alert("グループに参加するにはGoogleログインが必要です。");
          return;
        }

        const password = document
          .getElementById("groupPassword")
          .value.trim();

        if (password.length < 6) {
          alert("パスワードは6文字以上で入力してください。");
          return;
        }

        try {
          const groupId = await hashPassword(password);

          const snapshot = await groupRecordsRef(groupId)
            .limit(1)
            .get();

          if (snapshot.empty) {
            const ok = confirm(
              "このパスワードのグループには、まだ記録がありません。\n" +
              "新しいグループとして始めますか？\n\n" +
              "既存のグループに参加するつもりなら、" +
              "パスワードが合っているか確認してください。"
            );

            if (!ok) {
              return;
            }
          }

          currentGroupId = groupId;
          localStorage.setItem(GROUP_KEY, groupId);

          startGroupListener();

          if (
            records.length > 0 &&
            confirm(
              `自分の過去の記録（${records.length}件）も` +
              "グループに共有しますか？"
            )
          ) {
            await shareAllRecordsToGroup();
          }

          updateGroupUI();
          groupModal.style.display = "none";
        } catch (error) {
          console.error("グループ参加エラー:", error);

          alert(
            "グループに参加できませんでした。\n" +
            error.message
          );
        }
      });

    document
      .getElementById("btnGroupLeave")
      .addEventListener("click", () => {
        const ok = confirm(
          "グループから退出しますか？\n" +
          "すでに共有した記録はグループに残ります。"
        );

        if (!ok) {
          return;
        }

        stopGroupListener();

        currentGroupId = null;
        groupRecords = [];
        groupIds = new Set();

        localStorage.removeItem(GROUP_KEY);

        updateGroupUI();
        renderMarkers();

        groupModal.style.display = "none";
      });

    /* 自分の記録とグループの記録を、idの重複なしでまとめる */
    function getDisplayRecords() {
      const merged = new Map();

      groupRecords.forEach((record) => {
        merged.set(record.id, record);
      });

      records.forEach((record) => {
        merged.set(record.id, {
          ...(merged.get(record.id) || {}),
          ...record
        });
      });

      return Array.from(merged.values());
    }

    /*
     * ========================================
     * マーカー表示
     * ========================================
     */

    const COLOR_MAP = {
      "すぐ": "#4caf50",
      "普通": "#ffc107",
      "おそい": "#f44336"
    };

    const ICON_MAP = {
      "手上げ": "✋",
      "GO": "📱",
      "無線": "📻"
    };

    const AMOUNT_COLORS = {
      low: "#f44336",
      middle: "#ffc107",
      high: "#4caf50"
    };

    function getClassificationAmount(record) {
      if (record.kikkake === "手上げ") {
        return record.ryoukin;
      }

      return Math.max(
        0,
        record.ryoukin - settings.pickupFee
      );
    }

    function getAmountColor(amount) {
      if (amount < settings.boundary1) {
        return AMOUNT_COLORS.low;
      }

      if (amount < settings.boundary2) {
        return AMOUNT_COLORS.middle;
      }

      return AMOUNT_COLORS.high;
    }

    function createDivIcon(record) {
      /* 自分の記録は白い枠、グループのメンバーの記録は青い枠 */
      const borderColor = isOwnRecord(record) ? "#fff" : "#1565c0";

      let html = "";

      if (mode === "normal") {
        const color =
          COLOR_MAP[record.norikata] || "#999";

        const icon =
          ICON_MAP[record.kikkake] || "?";

        html = `
          <div style="
            display:flex;
            align-items:center;
            justify-content:center;
            width:32px;
            height:32px;
            color:#000;
            font-size:16px;
            background:${color};
            border:2px solid ${borderColor};
            border-radius:50%;
            box-shadow:0 1px 4px rgba(0,0,0,0.4);
          ">
            ${icon}
          </div>
        `;
      } else {
        const color = getAmountColor(
          getClassificationAmount(record)
        );

        html = `
          <div style="
            width:32px;
            height:32px;
            box-sizing:border-box;
            background:${color};
            border:3px solid ${borderColor};
            border-radius:50%;
            box-shadow:0 1px 4px rgba(0,0,0,0.5);
          "></div>
        `;
      }

      return L.divIcon({
        html,
        className: "",
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    function updateLegend() {
      const legend = document.getElementById("amountLegend");

      if (mode !== "amount") {
        legend.style.display = "none";
        return;
      }

      const b1 = settings.boundary1.toLocaleString();
      const b2 = settings.boundary2.toLocaleString();

      legend.innerHTML =
        `<div><span class="legend-dot" style="background:${AMOUNT_COLORS.low}"></span>${b1}円未満</div>` +
        `<div><span class="legend-dot" style="background:${AMOUNT_COLORS.middle}"></span>${b1}〜${b2}円未満</div>` +
        `<div><span class="legend-dot" style="background:${AMOUNT_COLORS.high}"></span>${b2}円以上</div>`;

      legend.style.display = "block";
    }

    /* スライダーの時刻の前後30分（日付は問わない）だけ表示 */
    function passesFilter(record) {
      if (filterMinute === null) {
        return true;
      }

      const date = new Date(record.time);

      if (Number.isNaN(date.getTime())) {
        return false;
      }

      const minute = date.getHours() * 60 + date.getMinutes();

      let diff = Math.abs(minute - filterMinute);
      diff = Math.min(diff, 1440 - diff);

      return diff <= 30;
    }

    function renderMarkers() {
      markersLayer.clearLayers();

      getDisplayRecords()
        .filter((record) => {
          return (
            Number.isFinite(Number(record.lat)) &&
            Number.isFinite(Number(record.lng)) &&
            passesFilter(record)
          );
        })
        .forEach((record) => {
          const marker = L.marker(
            [Number(record.lat), Number(record.lng)],
            {
              icon: createDivIcon(record)
            }
          );

          marker.on("click", () => {
            openDetailModal(record);
          });

          marker.addTo(markersLayer);
        });
    }

    /*
     * ========================================
     * 記録の詳細（編集・削除）
     * ========================================
     */

    const detailModal = document.getElementById("detailModal");

    function addDetailRow(parent, label, value) {
      const row = document.createElement("div");
      row.className = "detail-row";

      const labelElement = document.createElement("span");
      labelElement.textContent = label;

      row.appendChild(labelElement);
      row.appendChild(document.createTextNode(value));

      parent.appendChild(row);
    }

    function openDetailModal(record) {
      detailRecord = record;

      const date = new Date(record.time);

      const dateText = Number.isNaN(date.getTime())
        ? "日時不明"
        : date.toLocaleString("ja-JP");

      const body = document.getElementById("detailBody");
      body.textContent = "";

      addDetailRow(body, "日時", dateText);
      addDetailRow(body, "乗り方", record.norikata);
      addDetailRow(body, "きっかけ", record.kikkake);
      addDetailRow(body, "料金", `${record.ryoukin}円`);

      const own = isOwnRecord(record);

      if (!own) {
        addDetailRow(
          body,
          "記録した人",
          record.userName || "グループのメンバー"
        );
      }

      document.getElementById("btnDetailEdit").style.display =
        own ? "block" : "none";

      document.getElementById("btnDetailDelete").style.display =
        own ? "block" : "none";

      detailModal.style.display = "flex";
    }

    function closeDetailModal() {
      detailModal.style.display = "none";
      detailRecord = null;
    }

    document
      .getElementById("btnDetailClose")
      .addEventListener("click", closeDetailModal);

    document
      .getElementById("btnDetailEdit")
      .addEventListener("click", () => {
        const target = detailRecord;

        closeDetailModal();

        if (target) {
          openRecordModal(target);
        }
      });

    document
      .getElementById("btnDetailDelete")
      .addEventListener("click", () => {
        const target = detailRecord;

        if (!target) {
          return;
        }

        if (confirm("この記録を削除しますか？")) {
          closeDetailModal();
          deleteRecord(target);
        }
      });

    /*
     * ========================================
     * 記録削除
     * ========================================
     */

    async function deleteRecord(record) {
      const personal = records.find((item) => {
        return item.id === record.id;
      });

      const inGroup = groupIds.has(record.id);

      records = records.filter((item) => {
        return item.id !== record.id;
      });

      groupRecords = groupRecords.filter((item) => {
        return item.id !== record.id;
      });

      groupIds.delete(record.id);

      saveRecordsLocally();
      renderMarkers();

      const user = auth.currentUser;

      if (!user) {
        return;
      }

      try {
        /*
         * 古い保存方式の記録はFirestoreの自動ID、
         * 新しい記録はrecord.idを使用します。
         */
        const documentId =
          (personal && personal._firestoreDocId) || record.id;

        await db
          .collection("users")
          .doc(user.uid)
          .collection("records")
          .doc(documentId)
          .delete();

        if (currentGroupId && inGroup) {
          await groupRecordsRef(currentGroupId)
            .doc(record.id)
            .delete();
        }
      } catch (error) {
        console.error(
          "Firestoreからの削除エラー:",
          error
        );

        alert(
          "端末からは削除しましたが、" +
          "クラウドからの削除に失敗しました。\n" +
          error.message
        );
      }
    }

    /*
     * ========================================
     * 金額確認モード
     * ========================================
     */

    document
      .getElementById("btnAmountMode")
      .addEventListener("click", () => {
        mode =
          mode === "normal"
            ? "amount"
            : "normal";

        document.getElementById(
          "btnAmountMode"
        ).textContent =
          mode === "normal"
            ? "🔘"
            : "💰";

        updateLegend();
        renderMarkers();
      });

    /*
     * ========================================
     * 設定
     * ========================================
     */

    const settingsModal =
      document.getElementById("settingsModal");

    document
      .getElementById("btnSettings")
      .addEventListener("click", () => {
        document.getElementById(
          "settingBoundary1"
        ).value = settings.boundary1;

        document.getElementById(
          "settingBoundary2"
        ).value = settings.boundary2;

        document.getElementById(
          "settingPickupFee"
        ).value = settings.pickupFee;

        settingsModal.style.display = "flex";
      });

    document
      .getElementById("btnCancelSettings")
      .addEventListener("click", () => {
        settingsModal.style.display = "none";
      });

    document
      .getElementById("btnSaveSettings")
      .addEventListener("click", () => {
        const boundary1 = Number.parseInt(
          document.getElementById(
            "settingBoundary1"
          ).value,
          10
        );

        const boundary2 = Number.parseInt(
          document.getElementById(
            "settingBoundary2"
          ).value,
          10
        );

        const pickupFee = Number.parseInt(
          document.getElementById(
            "settingPickupFee"
          ).value,
          10
        );

        const hasInvalidValue =
          !Number.isFinite(boundary1) ||
          !Number.isFinite(boundary2) ||
          !Number.isFinite(pickupFee) ||
          boundary1 < 0 ||
          boundary2 < 0 ||
          pickupFee < 0 ||
          boundary1 >= boundary2;

        if (hasInvalidValue) {
          alert(
            "境界金額・迎車料金を正しく入力してください。\n" +
            "「赤／黄の境界 < 黄／緑の境界」にする必要があります。"
          );
          return;
        }

        settings = {
          boundary1,
          boundary2,
          pickupFee
        };

        saveSettings();

        settingsModal.style.display = "none";

        updateLegend();
        renderMarkers();
      });

    /*
     * ========================================
     * 時間帯スライダー
     * ========================================
     */

    const timeSlider = document.getElementById("timeSlider");
    const timeLabel = document.getElementById("timeLabel");

    function formatMinute(minute) {
      const normalized = ((minute % 1440) + 1440) % 1440;
      const hour = Math.floor(normalized / 60);
      const min = normalized % 60;

      return (
        String(hour).padStart(2, "0") +
        ":" +
        String(min).padStart(2, "0")
      );
    }

    function updateTimeLabel() {
      if (filterMinute === null) {
        timeLabel.textContent = "🕒 全時間帯を表示";
        return;
      }

      timeLabel.textContent =
        `🕒 ${formatMinute(filterMinute)} の前後30分` +
        `（${formatMinute(filterMinute - 30)}〜` +
        `${formatMinute(filterMinute + 30)}）`;
    }

    function applyTimeFilter(minute) {
      filterMinute = minute;
      updateTimeLabel();
      renderMarkers();
    }

    timeSlider.addEventListener("input", () => {
      applyTimeFilter(Number.parseInt(timeSlider.value, 10));
    });

    document
      .getElementById("btnTimeNow")
      .addEventListener("click", () => {
        const now = new Date();

        const minute =
          Math.round(
            (now.getHours() * 60 + now.getMinutes()) / 5
          ) * 5;

        const clamped = Math.min(minute, 1435);

        timeSlider.value = String(clamped);
        applyTimeFilter(clamped);
      });

    document
      .getElementById("btnTimeClear")
      .addEventListener("click", () => {
        applyTimeFilter(null);
      });

    /*
     * ========================================
     * Googleログイン
     * ========================================
     */

    document
      .getElementById("btnLogin")
      .addEventListener("click", async () => {
        const provider =
          new firebase.auth.GoogleAuthProvider();

        try {
          await auth.signInWithPopup(provider);
        } catch (error) {
          console.error("ログインエラー:", error);

          /* ポップアップが使えない環境では画面遷移方式に切り替える */
          if (
            error.code === "auth/popup-blocked" ||
            error.code === "auth/operation-not-supported-in-this-environment"
          ) {
            try {
              await auth.signInWithRedirect(provider);
              return;
            } catch (redirectError) {
              console.error(redirectError);
            }
          }

          if (error.code === "auth/popup-closed-by-user") {
            return;
          }

          alert(
            "ログインに失敗しました。\n" +
            error.message
          );
        }
      });

    document
      .getElementById("btnLogout")
      .addEventListener("click", async () => {
        try {
          await auth.signOut();
        } catch (error) {
          console.error("ログアウトエラー:", error);

          alert(
            "ログアウトに失敗しました。\n" +
            error.message
          );
        }
      });

    auth.onAuthStateChanged(async (user) => {
      const loginButton =
        document.getElementById("btnLogin");

      const logoutButton =
        document.getElementById("btnLogout");

      const userInfo =
        document.getElementById("userInfo");

      if (user) {
        loginButton.style.display = "none";
        logoutButton.style.display = "inline-block";

        userInfo.textContent =
          `${user.displayName || user.email || "ユーザー"} でログイン中`;

        await loadRecordsFromFirestore();

        startGroupListener();
      } else {
        loginButton.style.display = "inline-block";
        logoutButton.style.display = "none";
        userInfo.textContent = "";

        stopGroupListener();
        groupRecords = [];
        groupIds = new Set();

        records = loadLocalRecords();
        renderMarkers();
      }

      updateGroupUI();
    });

    /*
     * 最初はゲスト用の端末データを表示します。
     * ログイン状態の確認後、必要に応じて再読み込みされます。
     * ログインしなくても、記録は端末内に保存して使えます。
     */
    records = loadLocalRecords();
    renderMarkers();
    updateLegend();
    updateGroupUI();

    /* 入力途中でページが再読み込みされていたら復元する */
    restoreDraft();
  </script>
</body>
</html>
